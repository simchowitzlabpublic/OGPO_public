# =============================================================================
# BPTT (OGPO-BPTT) Configuration
# =============================================================================
# Backpropagation Through Time variant of OGPO

_base_: common.yaml

agent:
  # Identification
  agent_name: ogpo_bptt

  # CalQL Parameters
  cql_alpha: 0.01
  cql_temp: 1.0
  cql_n_actions: 10

  # Muon optimizer
  use_muon: false
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true

  # BPTT-specific settings
  ppo_batch_size: 64
  bptt_num_samples: 4  # Number of action samples for gradient estimation

  # PPO parameters
  clip_epsilon: 0.01
  entropy_coeff: 0.0
  vf_coef: 0.5
  gae_lambda: 0.95

  # GRPO parameters
  group_num_samples: 32

  # MIP settings
  mip_t_star: 0.9

  # Shortcut settings
  use_shortcut: false
  shortcut_inference_steps: 4
  shortcut_denoising_steps: 32
  bootstrap_ratio: 0.125

  # BC regularization
  use_bc_regularization: true
  bc_coeff: 0.1

  # Noise settings
  use_constant_noise: false
  constant_noise_std: 0.01
  noise_net_hidden_dims: [128, 128]
  noise_net_layer_norm: false
  min_noise_std: 0.08
  max_noise_std: 0.14

  # Advanced settings
  logprob_min: -1.0
  logprob_max: 1.0
  clip_intermediate_actions: true
  denoised_clip_value: 1.0
  normalize_denoising_horizon: true
  normalize_act_space_dimension: true
  clip_min_epsilon_multiplier: 1.0
  clip_max_epsilon_multiplier: 1.0
  pg_coeff: 1.0
  adv_clip_min: null

  # SDE-ODE correction
  error_correct_sde_to_ode: false
  use_denoiser: false

  # Flow timestep encoding
  time_embedding: sinusoidal  # scalar | sinusoidal
  time_embedding_dim: 32

  # Flow steps (BPTT default)
  flow_steps: 3
  ft_flow_steps: 3

  # BPTT default: no Best-of-N (uses BPTT instead)
  best_of_n: 1
